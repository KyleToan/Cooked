<!-- @dsCard group="Structure" height=200 subtitle="Header and search" -->
<div style="font-family: var(--font-sans); color: var(--ink); background: var(--surface); padding: 28px 20px; max-width: 350px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 500; color: var(--ink-muted)">Good evening, Alex</span>
      <span style="font-family: var(--font-display); font-size: 48px; font-weight: 700; letter-spacing: -0.01em; line-height: 0.95">Cooked</span>
    </div>
    <button aria-label="Account and household" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--ink); padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c1-4 4-5.5 7.5-5.5s6.5 1.5 7.5 5.5"/></svg>
    </button>
  </div>
  <label style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface)">
    <input type="search" placeholder="Search saved recipes" aria-label="Search saved recipes" style="flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 16px; color: var(--ink); outline: none; padding: 0">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
  </label>
</div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Alumni+Sans:wght@300;600;700&display=swap';document.head.appendChild(l);})();
</script>
