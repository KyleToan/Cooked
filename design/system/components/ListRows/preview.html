<!-- @dsCard group="Lists" height=470 subtitle="Kitchen, check items, recipe" -->
<div style="font-family: var(--font-sans); color: var(--ink); background: var(--surface); padding: 20px; max-width: 350px; display: flex; flex-direction: column">
  <div style="border-bottom: 1px solid var(--line-soft)">
    <div style="min-height: 60px; display: flex; align-items: center; gap: 10px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">Spinach</span><span style="font-size: 13px; font-weight: 600; color: var(--bronze-ink)">Best by tomorrow</span></span>
      <span style="font-size: 15px; font-weight: 500; color: var(--ink-muted)">1 bag</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-subtle)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
      <a href="#" style="font-size: 14px; font-weight: 600; color: var(--sage-ink); text-decoration: none">Find a recipe that uses it</a>
      <span style="display: flex; align-items: center; height: 44px; border-radius: 22px; background: var(--surface-sunken)"><span style="width: 44px; text-align: center; color: var(--sage-ink); font-size: 18px">−</span><span style="min-width: 24px; text-align: center; font-size: 15px; font-weight: 600">1</span><span style="width: 44px; text-align: center; color: var(--sage-ink); font-size: 18px">+</span></span>
    </div>
  </div>
  <div style="border-bottom: 1px solid var(--line-soft)">
    <div style="min-height: 60px; display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; border-bottom: 1px solid var(--sage-ink); align-self: flex-start">Milk 2%</span><span style="font-size: 12px; color: var(--ink-muted)">1 · $3.49</span></span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: var(--cornsilk); display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600">Fridge <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-bottom: 14px">
      <span style="height: 44px; border-radius: 22px; background: var(--cornsilk); box-shadow: inset 0 0 0 1.5px var(--sage-ink); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">Fridge</span>
      <span style="height: 44px; border-radius: 22px; background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--ink-muted)">Pantry</span>
      <span style="height: 44px; border-radius: 22px; background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--ink-muted)">Freezer</span>
      <span style="height: 44px; border-radius: 22px; background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--ink-muted)">Skip</span>
    </div>
  </div>
  <div style="padding: 14px 0 10px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; gap: 14px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <span style="display: flex; justify-content: space-between"><span style="font-size: 17px; font-weight: 600">Shakshuka</span><span style="font-size: 13px; color: var(--ink-muted)">25 min</span></span>
        <span style="font-size: 14px; line-height: 1.45; color: var(--ink-muted)">You have 6 of 8. Missing tomatoes and feta.</span>
      </span>
      <span style="width: 64px; height: 64px; border-radius: 12px; background: var(--line-soft)"></span>
    </div>
    <span style="align-self: flex-start; height: 36px; padding: 0 12px; border-radius: 999px; background: var(--surface-sunken); display: flex; align-items: center; font-size: 13px; font-weight: 600">+ Add 2 to To Buy</span>
  </div>
</div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Alumni+Sans:wght@300;600;700&family=Caveat:wght@400;700&display=swap';document.head.appendChild(l);})();
</script>
