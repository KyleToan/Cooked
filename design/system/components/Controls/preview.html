<!-- @dsCard group="Actions" height=380 subtitle="Switch, filters, stepper, undo, field" -->
<div style="font-family: var(--font-sans); color: var(--ink); background: var(--surface); padding: 24px 20px; max-width: 350px; display: flex; flex-direction: column; gap: 18px">
  <div style="height: 48px; box-sizing: border-box; padding: 2px; border-radius: 24px; background: var(--surface-sunken); display: grid; grid-template-columns: 1fr 1fr; gap: 4px">
    <span style="border-radius: 22px; background: var(--surface); box-shadow: 0 1px 2px rgba(26,26,24,0.08); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Link</span>
    <span style="display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--ink-muted)">Text</span>
  </div>
  <div style="display: flex; gap: 8px">
    <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: var(--sage); display: flex; align-items: center; font-size: 14px; font-weight: 600">All</span>
    <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface-sunken); display: flex; align-items: center; font-size: 14px; color: var(--ink-muted)">Can make now</span>
    <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface-sunken); display: flex; align-items: center; font-size: 14px; color: var(--ink-muted)">Imported</span>
  </div>
  <span style="align-self: flex-start; display: flex; align-items: center; height: 44px; border-radius: 22px; background: var(--surface-sunken)"><span style="width: 44px; text-align: center; color: var(--sage-ink); font-size: 18px">−</span><span style="min-width: 24px; text-align: center; font-size: 15px; font-weight: 600">2</span><span style="width: 44px; text-align: center; color: var(--sage-ink); font-size: 18px">+</span></span>
  <div style="height: 52px; box-sizing: border-box; padding: 0 20px 0 18px; border-radius: 26px; border: 1px solid var(--line); box-shadow: var(--shadow-island); display: flex; align-items: center; justify-content: space-between; font-size: 15px"><span>Bread ticked off</span><span style="font-weight: 600; color: var(--sage-ink)">Undo</span></div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="height: 58px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--error-ink); display: flex; flex-direction: column; justify-content: center; gap: 2px"><span style="font-size: 12px; color: var(--ink-muted)">Invite link or code</span><span style="font-size: 16px">rivera-kitchn</span></div>
    <span style="font-size: 14px; font-weight: 600; color: var(--error-ink)">We couldn’t find that kitchen. Check the code.</span>
  </div>
</div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Alumni+Sans:wght@300;600;700&family=Caveat:wght@400;700&display=swap';document.head.appendChild(l);})();
</script>
