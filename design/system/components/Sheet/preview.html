<!-- @dsCard group="Structure" height=420 subtitle="Error sheet over a screen" -->
<div style="font-family: var(--font-sans); color: var(--ink); position: relative; height: 420px; max-width: 390px; overflow: hidden; background: #2A2A27">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 24px 32px; border-radius: 28px 28px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 16px">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #DCDCD6"></span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1">Couldn’t read this receipt</span>
      <span style="font-size: 15px; line-height: 1.45; color: var(--ink-muted)">The photo looks blurry or the bottom is cut off. Lay it flat in good light and fit all of it inside the corners.</span>
    </div>
    <a href="#" style="height: 52px; border-radius: 26px; background: var(--sage); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Retake photo</a>
    <a href="#" style="align-self: center; font-size: 15px; font-weight: 600; color: var(--sage-ink); text-decoration: none">Add the items by hand</a>
  </div>
</div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Alumni+Sans:wght@300;600;700&family=Caveat:wght@400;700&display=swap';document.head.appendChild(l);})();
</script>
