<script>
(function(){
  var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500&display=swap';document.head.appendChild(l);
  var s=document.createElement('style');
  s.textContent='@keyframes ckspin{to{transform:rotate(360deg)}}@keyframes cksteam{0%,100%{opacity:.2}50%{opacity:1}}'+
    '#cooked-icons .ck-spin{animation:ckspin .9s linear infinite}#cooked-icons .ck-sync{animation:ckspin 1.6s linear infinite}'+
    '#cooked-icons .ck-steam{animation:cksteam 1.5s ease-in-out infinite}#cooked-icons .ck-d2{animation-delay:.25s}#cooked-icons .ck-d3{animation-delay:.5s}'+
    '@media (prefers-reduced-motion: reduce){#cooked-icons .ck-spin,#cooked-icons .ck-sync,#cooked-icons .ck-steam{animation:none;opacity:1}}';
  document.head.appendChild(s);
})();
</script>
