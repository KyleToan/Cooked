<!-- @dsCard group="Lists" height=340 subtitle="To Buy" -->
<div style="font-family: var(--font-sans); color: var(--ink); background: var(--surface); padding: 24px 20px; max-width: 350px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <div style="display: flex; align-items: baseline; gap: 10px">
      <span style="font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.05">To Buy</span>
      <span style="font-size: 13px; color: var(--ink-muted)">1 of 3 done</span>
    </div>
    <a href="#" style="font-size: 14px; font-weight: 600; color: var(--sage-ink); text-decoration: none">See all</a>
  </div>
  <div style="height: 4px; border-radius: 4px; background: var(--line-soft); overflow: hidden"><div style="height: 4px; width: 33%; border-radius: 4px; background: var(--progress)"></div></div>
  <div style="display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 14px; min-height: 56px; border-bottom: 1px solid var(--line-soft)">
      <span style="width: 24px; height: 24px; box-sizing: border-box; flex-shrink: 0; border-radius: 7px; border: 1.5px solid #B5B5AF"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">Tomatoes</span><span style="font-size: 12px; color: var(--ink-muted)">For Shakshuka</span></span>
      <span style="font-size: 13px; color: var(--ink-muted)">Fridge</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; min-height: 56px; border-bottom: 1px solid var(--line-soft)">
      <span style="width: 24px; height: 24px; box-sizing: border-box; flex-shrink: 0; border-radius: 7px; border: 1.5px solid #B5B5AF"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">Frozen berries</span><span style="font-size: 12px; color: var(--ink-muted)">Added by Sam</span></span>
      <span style="font-size: 13px; color: var(--ink-muted)">Freezer</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; min-height: 56px; border-bottom: 1px solid var(--line-soft)">
      <span style="width: 24px; height: 24px; box-sizing: border-box; flex-shrink: 0; border-radius: 7px; background: var(--sage-ink); display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--on-ink)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: var(--ink-off); text-decoration: line-through">Bread</span><span style="font-size: 12px; color: var(--ink-muted)">Got it</span></span>
      <span style="font-size: 13px; color: var(--ink-muted)">Pantry</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; height: 56px">
      <span style="width: 24px; height: 24px; box-sizing: border-box; flex-shrink: 0; border-radius: 7px; border: 1.5px dashed var(--check-border); display: flex; align-items: center; justify-content: center; color: var(--sage-ink)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span style="font-size: 16px; color: var(--ink-subtle)">Add an item…</span>
    </div>
  </div>
</div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Alumni+Sans:wght@300;600;700&family=Caveat:wght@400;700&display=swap';document.head.appendChild(l);})();
</script>
