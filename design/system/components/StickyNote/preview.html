<!-- @dsCard group="Kitchen" height=380 subtitle="Kitchen row and big note" -->
<div style="font-family: var(--font-sans); background: var(--surface); padding: 28px 20px; max-width: 350px; display: flex; flex-direction: column; gap: 30px">
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <a href="#" style="position: relative; height: 116px; box-sizing: border-box; padding: 14px 12px 10px; border-radius: 3px 3px 14px 3px; box-shadow: var(--shadow-note); display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; background: var(--cornsilk); transform: rotate(-2.5deg)"><span style="position: absolute; top: -8px; left: 50%; width: 40px; height: 15px; transform: translateX(-50%) rotate(-3deg); background: rgba(255,255,255,0.65); border: 1px solid rgba(26,26,24,0.06)"></span>
      <span style="font-family: var(--font-hand); font-size: 26px; font-weight: 700; line-height: 1; color: var(--note-ink)">Fridge</span>
      <span style="display: flex; flex-direction: column"><span style="font-family: var(--font-hand); font-size: 19px; color: var(--note-ink-soft)">12 items</span><span style="font-family: var(--font-hand); font-size: 18px; font-weight: 700; color: var(--bronze-ink); text-decoration: underline; text-decoration-color: var(--bronze); text-decoration-thickness: 2px">2 use soon</span></span>
    </a>
    <a href="#" style="position: relative; height: 116px; box-sizing: border-box; padding: 14px 12px 10px; border-radius: 3px 3px 14px 3px; box-shadow: var(--shadow-note); display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; background: var(--papaya); transform: rotate(1.5deg)"><span style="position: absolute; top: -8px; left: 50%; width: 40px; height: 15px; transform: translateX(-50%) rotate(-3deg); background: rgba(255,255,255,0.65); border: 1px solid rgba(26,26,24,0.06)"></span>
      <span style="font-family: var(--font-hand); font-size: 26px; font-weight: 700; line-height: 1; color: var(--note-ink)">Pantry</span>
      <span style="font-family: var(--font-hand); font-size: 19px; color: var(--note-ink-soft)">18 items</span>
    </a>
    <a href="#" style="position: relative; height: 116px; box-sizing: border-box; padding: 14px 12px 10px; border-radius: 3px 3px 14px 3px; box-shadow: var(--shadow-note); display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; background: var(--beige); transform: rotate(-1deg)"><span style="position: absolute; top: -8px; left: 50%; width: 40px; height: 15px; transform: translateX(-50%) rotate(-3deg); background: rgba(255,255,255,0.65); border: 1px solid rgba(26,26,24,0.06)"></span>
      <span style="font-family: var(--font-hand); font-size: 26px; font-weight: 700; line-height: 1; color: var(--note-ink)">Freezer</span>
      <span style="font-family: var(--font-hand); font-size: 19px; color: var(--note-ink-soft)">7 items</span>
    </a>
  </div>
  <div style="position: relative; margin: 0 4px; padding: 22px 20px 20px; background: var(--cornsilk); border-radius: 3px 3px 16px 3px; box-shadow: var(--shadow-note); transform: rotate(-1deg); display: flex; flex-direction: column; gap: 10px">
    <span style="position: absolute; top: -9px; left: 50%; width: 52px; height: 17px; transform: translateX(-50%) rotate(-3deg); background: rgba(255,255,255,0.65); border: 1px solid rgba(26,26,24,0.06)"></span>
    <span style="font-family: var(--font-hand); font-size: 30px; font-weight: 700; line-height: 1; color: var(--note-ink)">Nothing here yet</span>
    <span style="font-size: 15px; line-height: 1.45; color: var(--note-ink-soft)">Scan your next grocery receipt and Cooked puts each item away for you.</span>
    <a href="#" style="align-self: flex-start; height: 44px; padding: 0 18px; border-radius: 999px; background: var(--sage); color: var(--ink); display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none">Scan a receipt</a>
  </div>
</div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Alumni+Sans:wght@300;600;700&family=Caveat:wght@400;700&display=swap';document.head.appendChild(l);})();
</script>
