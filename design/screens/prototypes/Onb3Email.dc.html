<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooked – Email or phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&amp;family=Alumni+Sans:wght@300;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#56663A;text-decoration:none}a:hover{color:#3F4B2A}
button,input{font-family:inherit}
input::placeholder{color:#8C8C86}
.ck-field{border:1px solid #ECECE8}
.ck-field:focus-within{border-color:#56663A;box-shadow:inset 0 0 0 0.5px #56663A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #1A1A18; font-family: 'Albert Sans', system-ui, sans-serif">
  <div style="position: absolute; left: 24px; top: 56px; width: 342px; display: flex; flex-direction: column; gap: 20px">
    <a href="Onb2SignIn.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; color: #1A1A18">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Alumni Sans', sans-serif; font-size: 36px; font-weight: 700; line-height: 1">{{title}}</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.4; color: #6E6E68">{{sub}}</p>
    </div>

    <div role="tablist" aria-label="Sign in with" style="height: 48px; box-sizing: border-box; padding: 2px; border-radius: 24px; background: #F4F4F1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{m.selected}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isEmail}}" hint-placeholder-val="{{ true }}">
      <label for="onb-email" class="ck-field" style="border: 1.5px solid #56663A; display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 58px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; ">
        <span style="font-size: 12px; color: #6E6E68">Email</span>
        <input id="onb-email" type="email" autocomplete="email" value="alex.rivera@gmail.com" style="border: none; outline: none; padding: 0; font-size: 16px; color: #1A1A18; background: transparent">
      </label>
    </sc-if>
    <sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}">
      <div style="display: grid; grid-template-columns: 92px 1fr; gap: 10px">
        <button aria-label="Country code" style="height: 58px; box-sizing: border-box; border-radius: 14px; border: 1px solid #ECECE8; background: #FFFFFF; color: #1A1A18; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 16px">
          +1
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6E6E68" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <label for="onb-phone" class="ck-field" style="border: 1.5px solid #56663A; display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 58px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; ">
          <span style="font-size: 12px; color: #6E6E68">Phone number</span>
          <input id="onb-phone" type="tel" autocomplete="tel-national" placeholder="(555) 014-2290" style="border: none; outline: none; padding: 0; font-size: 16px; color: #1A1A18; background: transparent">
        </label>
      </div>
    </sc-if>

    <a href="Onb4Code.dc.html" style="height: 52px; border-radius: 26px; background: #CCD5AE; color: #1A1A18; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Send code</a>
  </div>
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 291px">
    <dc-import name="CookedKeyboard" layout="{{kbLayout}}" suggest="{{kbSuggest}}" hint="" href="" hint-size="390px,291px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'email' };
  }
  renderVals() {
    const m = this.state.mode;
    return {
      isEmail: m === 'email', isPhone: m === 'phone',
      kbLayout: m === 'email' ? 'email' : 'numbers',
      kbSuggest: m === 'email' ? 'alex.rivera@gmail.com' : '',
      title: m === 'email' ? 'What’s your email?' : 'What’s your number?',
      sub: m === 'email' ? 'We’ll send a code to make sure it’s you. No password needed.' : 'We’ll text you a code to make sure it’s you. No password needed.',
      modes: [['email', 'Email'], ['phone', 'Phone']].map(([id, label]) => {
        const on = id === m;
        return {
          label, selected: on ? 'true' : 'false',
          style: 'border: none; border-radius: 22px; cursor: pointer; font-size: 14px; ' + (on ? 'background: #FFFFFF; color: #1A1A18; font-weight: 600; box-shadow: 0 1px 2px rgba(26,26,24,0.08);' : 'background: transparent; color: #6E6E68; font-weight: 500;'),
          pick: () => this.setState({ mode: id })
        };
      })
    };
  }
}
</script>
</body>
</html>
