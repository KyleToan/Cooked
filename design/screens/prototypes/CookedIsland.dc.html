<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooked – Tab island</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<nav aria-label="Main" style="width: 300px; height: 68px; box-sizing: border-box; padding: 6px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECECE8; box-shadow: 0 10px 30px rgba(26,26,24,0.10); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; font-family: 'Albert Sans', system-ui, sans-serif">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
    <a href="{{t.href}}" aria-current="{{t.current}}" style="{{t.style}}">
      <sc-if value="{{t.isHome}}" hint-placeholder-val="{{ false }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"></path></svg>
      </sc-if>
      <sc-if value="{{t.isScan}}" hint-placeholder-val="{{ false }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
      </sc-if>
      <sc-if value="{{t.isRecipes}}" hint-placeholder-val="{{ false }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14a4 4 0 1 1 2.5-7.2A4 4 0 0 1 17 7a3.5 3.5 0 0 1 0 7v6H7z"></path><path d="M7 17h10"></path></svg>
      </sc-if>
      <span style="{{t.labelStyle}}">{{t.label}}</span>
      <span style="{{t.markStyle}}"></span>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","scan","recipes"],"default":"home"},"$preview":{"width":300,"height":68}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const T = [['home', 'Home', 'AppHome.dc.html'], ['scan', 'Scan', 'AppScan.dc.html'], ['recipes', 'Recipes', 'AppRecipes.dc.html']];
    return {
      tabs: T.map(([id, label, href]) => {
        const on = id === active;
        return {
          label, href, current: on ? 'page' : 'false',
          isHome: id === 'home', isScan: id === 'scan', isRecipes: id === 'recipes',
          style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; color: ' + (on ? '#1A1A18' : '#6E6E68'),
          labelStyle: 'font-size: 11px; line-height: 13px; font-weight: ' + (on ? '600' : '500'),
          markStyle: 'width: 16px; height: 2.5px; border-radius: 2px; margin-top: 1px; background: ' + (on ? '#B5B5AF' : 'transparent')
        };
      })
    };
  }
}
</script>
</body>
</html>
