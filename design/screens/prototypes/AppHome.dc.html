<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooked – Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&amp;family=Alumni+Sans:wght@300;600;700&amp;family=Caveat:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#56663A;text-decoration:none}a:hover{color:#3F4B2A}
button,input{font-family:inherit}
input::placeholder{color:#8C8C86}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #1A1A18; font-family: 'Albert Sans', system-ui, sans-serif">
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; padding: 60px 20px 130px; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; font-weight: 500; color: #6E6E68">{{greeting}}</span>
        <h1 style="margin: 0; font-family: 'Alumni Sans', sans-serif; font-size: 48px; font-weight: 700; line-height: 0.95; letter-spacing: -0.005em">Cooked</h1>
      </div>
      <a href="AppAccount.dc.html" aria-label="Account and household" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1px solid #ECECE8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1A1A18">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"></circle><path d="M4.5 20.5c1-4 4-5.5 7.5-5.5s6.5 1.5 7.5 5.5"></path></svg>
      </a>
    </div>

    <label style="display: flex; align-items: center; gap: 12px; height: 50px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1px solid #ECECE8; background: #FFFFFF">
      <input type="search" placeholder="Search your kitchen and recipes" aria-label="Search your kitchen and recipes" style="flex: 1; min-width: 0; border: none; background: transparent; font-size: 16px; color: #1A1A18; outline: none; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
    </label>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="AppScan.dc.html" style="height: 48px; border-radius: 999px; background: #CCD5AE; color: #1A1A18; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
        Scan a receipt
      </a>
      <a href="AppImport.dc.html" style="height: 48px; border-radius: 999px; background: #F4F4F1; color: #1A1A18; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56663A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
        Import recipe
      </a>
    </div>

    <section style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h2 style="margin: 0; font-family: 'Alumni Sans', sans-serif; font-size: 28px; font-weight: 600; line-height: 1.05">Your Kitchen</h2>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6E6E68">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 0 1-12.8 5.3M4.5 12A7.5 7.5 0 0 1 17.3 6.7"></path><path d="M17.5 3.5v3.4h-3.4M6.5 20.5v-3.4h3.4"></path></svg>
          Synced 2h ago from a receipt
        </span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 10px 2px 4px">
        <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
          <a href="{{n.href}}" style="{{n.style}}">
            <span style="position: absolute; top: -8px; left: 50%; width: 40px; height: 15px; margin-left: -20px; transform: rotate(-3deg); background: rgba(255,255,255,0.65); border: 1px solid rgba(26,26,24,0.06)"></span>
            <span style="font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700; line-height: 1; color: #2A2A26">{{n.label}}</span>
            <span style="font-family: 'Caveat', cursive; font-size: 19px; line-height: 1.1; color: #4A4A42">{{n.count}}</span>
            <sc-if value="{{n.hasFlag}}" hint-placeholder-val="{{ false }}">
              <span style="margin-top: auto; font-family: 'Caveat', cursive; font-size: 18px; line-height: 1.1; font-weight: 700; color: #8A5A2B; text-decoration: underline; text-decoration-color: #D4A373; text-decoration-thickness: 2px">{{n.flag}}</span>
            </sc-if>
          </a>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <div style="display: flex; align-items: baseline; gap: 10px">
          <h2 style="margin: 0; font-family: 'Alumni Sans', sans-serif; font-size: 28px; font-weight: 600; line-height: 1.05">To Buy</h2>
          <span style="font-size: 13px; color: #6E6E68">{{progress}}</span>
        </div>
        <a href="AppKitchenToBuy.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; margin: -12px 0; font-size: 14px; font-weight: 600">See all 6</a>
      </div>
      <div style="height: 4px; border-radius: 4px; background: #F1F1EE; overflow: hidden"><div style="{{barFill}}"></div></div>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{shop}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 4px; min-height: 56px; border-bottom: 1px solid #F1F1EE">
            <button onClick="{{s.toggle}}" aria-label="{{s.aria}}" aria-pressed="{{s.pressed}}" style="width: 44px; height: 44px; margin-left: -10px; flex-shrink: 0; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <span style="{{s.boxStyle}}">
                <sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                </sc-if>
              </span>
            </button>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 8px 0">
              <span style="{{s.nameStyle}}">{{s.name}}</span>
              <span style="font-size: 12px; color: #6E6E68">{{s.note}}</span>
            </span>
            <span style="font-size: 13px; color: #6E6E68">{{s.where}}</span>
          </div>
        </sc-for>
        <label style="display: flex; align-items: center; gap: 14px; height: 56px">
          <span style="width: 24px; height: 24px; box-sizing: border-box; flex-shrink: 0; border-radius: 7px; border: 1.5px dashed #CFCFC9; display: flex; align-items: center; justify-content: center; color: #56663A"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
          <input type="text" placeholder="Add an item…" aria-label="Add an item" style="flex: 1; min-width: 0; border: none; outline: none; padding: 0; background: transparent; font-size: 16px; color: #1A1A18">
        </label>
      </div>
    </section>
  </div>

  <sc-if value="{{hasUndo}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 20px; bottom: 108px; width: 350px; height: 52px; box-sizing: border-box; padding: 0 6px 0 18px; border-radius: 26px; background: #FFFFFF; border: 1px solid #ECECE8; box-shadow: 0 10px 30px rgba(26,26,24,0.10); display: flex; align-items: center; justify-content: space-between; font-size: 15px">
      <span>{{undoText}}</span>
      <button onClick="{{undo}}" style="height: 44px; padding: 0 14px; border: none; background: transparent; cursor: pointer; font-size: 15px; font-weight: 600; color: #56663A">Undo</button>
    </div>
  </sc-if>

  <div style="position: absolute; left: 45px; bottom: 28px; width: 300px; height: 68px">
    <dc-import name="CookedIsland" active="home" hint-size="300px,68px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"name":{"editor":"text","default":"Alex"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: {}, last: null };
  }
  renderVals() {
    const name = this.props.name ?? 'Alex';
    const h = new Date().getHours();
    const part = h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    const SHOP = [
      { id: 'a', name: 'Tomatoes', note: 'For Shakshuka', where: 'Fridge' },
      { id: 'f', name: 'Feta', note: 'For Shakshuka', where: 'Fridge' },
      { id: 'c', name: 'Frozen berries', note: 'Added by Sam', where: 'Freezer' }
    ];
    const { done, last } = this.state;
    const left = SHOP.filter((s) => !done[s.id]).length;
    const TOTAL = 6, TOTAL_DONE = 2; // the full list lives on the To Buy tab; Home shows what's still to get
    const NOTES = [
      { label: 'Fridge', count: '8 items', flag: '2 use soon', bg: '#FEFAE0', rot: -2.5, href: 'AppKitchen.dc.html' },
      { label: 'Pantry', count: '6 items', flag: '', bg: '#FAEDCD', rot: 1.5, href: 'AppKitchenPantry.dc.html' },
      { label: 'Freezer', count: '4 items', flag: '', bg: '#E9EDC9', rot: -1, href: 'AppKitchenFreezer.dc.html' }
    ];
    return {
      greeting: part + ', ' + name,
      hasUndo: !!last,
      undoText: last ? last.name + ' ticked off' : '',
      undo: () => last && this.setState({ done: { ...done, [last.id]: false }, last: null }),
      notes: NOTES.map((n) => ({
        label: n.label, count: n.count, flag: n.flag, hasFlag: !!n.flag, href: n.href,
        style: 'position: relative; height: 116px; box-sizing: border-box; padding: 14px 12px 10px; background: ' + n.bg + '; border-radius: 3px 3px 14px 3px; box-shadow: 0 1px 1px rgba(26,26,24,0.06), 0 8px 16px -6px rgba(26,26,24,0.18); transform: rotate(' + n.rot + 'deg); display: flex; flex-direction: column; justify-content: flex-start; gap: 8px; color: #2A2A26'
      })),
      progress: (TOTAL_DONE + SHOP.length - left) + ' of ' + TOTAL + ' done',
      barFill: 'height: 4px; border-radius: 4px; background: #6F7D45; width: ' + Math.round(((TOTAL_DONE + SHOP.length - left) / TOTAL) * 100) + '%;',
      shop: SHOP.slice().sort((x, y) => (!!done[x.id]) - (!!done[y.id])).map((s) => {
        const d = !!done[s.id];
        return {
          name: s.name, where: s.where, note: d ? 'Got it' : s.note, done: d,
          pressed: d ? 'true' : 'false', aria: 'Mark ' + s.name + ' as bought',
          boxStyle: 'width: 24px; height: 24px; box-sizing: border-box; border-radius: 7px; display: flex; align-items: center; justify-content: center; ' + (d ? 'background: #56663A; border: 1.5px solid #56663A;' : 'background: transparent; border: 1.5px solid #B5B5AF;'),
          nameStyle: 'font-size: 16px; ' + (d ? 'color: #8C8C86; text-decoration: line-through;' : 'color: #1A1A18;'),
          toggle: () => this.setState({ done: { ...done, [s.id]: !d }, last: d ? null : { id: s.id, name: s.name } })
        };
      })
    };
  }
}
</script>
</body>
</html>
