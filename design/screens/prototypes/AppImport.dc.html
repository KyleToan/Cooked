<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooked – Import a recipe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&amp;family=Alumni+Sans:wght@300;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#56663A;text-decoration:none}a:hover{color:#3F4B2A}
button,input,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#8C8C86}
@keyframes ckSpin{to{transform:rotate(360deg)}}
@keyframes ckSteam{0%,100%{opacity:.25;transform:translateY(1px)}50%{opacity:1;transform:translateY(-1px)}}
.ck-spin{animation:ckSpin 0.9s linear infinite;transform-origin:12px 12px}
.ck-steam{animation:ckSteam 1.4s ease-in-out infinite}
.ck-steam2{animation:ckSteam 1.4s ease-in-out 0.35s infinite}
@media (prefers-reduced-motion:reduce){.ck-spin,.ck-steam,.ck-steam2{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #1A1A18; font-family: 'Albert Sans', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none">
    <dc-import name="AppHome" hint-size="390px,844px"></dc-import>
  </div>
  <a href="AppHome.dc.html" aria-label="Close" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(26,26,24,0.32)"></a>

  <div role="dialog" aria-label="Import a recipe" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 10px 20px 36px; border-radius: 28px 28px 0 0; background: #FFFFFF; display: flex; flex-direction: column; gap: 18px">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #DCDCD6"></span>

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-family: 'Alumni Sans', sans-serif; font-size: 36px; font-weight: 700; line-height: 1">{{title}}</h1>
        <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6E6E68">{{sub}}</p>
      </div>
      <a href="AppHome.dc.html" aria-label="Close" style="flex-shrink: 0; width: 44px; height: 44px; margin: -4px -4px 0 0; display: flex; align-items: center; justify-content: center; color: #1A1A18">
        <span style="width: 36px; height: 36px; border-radius: 50%; background: #F4F4F1; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></span>
      </a>
    </div>

    <sc-if value="{{isEdit}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div role="tablist" aria-label="What are you pasting" style="height: 48px; box-sizing: border-box; padding: 2px; border-radius: 24px; background: #F4F4F1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px">
          <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
            <button role="tab" aria-selected="{{m.selected}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
          </sc-for>
        </div>

        <sc-if value="{{isLink}}" hint-placeholder-val="{{ true }}">
          <label style="display: flex; align-items: center; gap: 10px; height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; border: 1px solid #ECECE8">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56663A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
            <input type="url" value="{{link}}" onChange="{{onLink}}" placeholder="Paste a recipe link" aria-label="Recipe link" style="flex: 1; min-width: 0; border: none; outline: none; padding: 0; background: transparent; font-size: 16px; color: #1A1A18">
          </label>
        </sc-if>
        <sc-if value="{{isText}}" hint-placeholder-val="{{ false }}">
          <textarea value="{{text}}" onChange="{{onText}}" placeholder="Paste the ingredients and steps. Messy is fine." aria-label="Recipe text" style="height: 132px; box-sizing: border-box; padding: 14px; border-radius: 16px; border: 1px solid #ECECE8; outline: none; resize: none; font-size: 16px; line-height: 1.45; color: #1A1A18"></textarea>
          <span style="{{countStyle}}">{{countText}}</span>
        </sc-if>
        <sc-if value="{{hasHint}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 13px; font-weight: 600; color: #8A5A2B">{{hint}}</span>
        </sc-if>

        <button onClick="{{paste}}" style="align-self: flex-start; height: 44px; padding: 0 14px; box-sizing: border-box; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: none; border-right: none; background-clip: padding-box; border-radius: 999px; background-color: #F4F4F1; color: #1A1A18; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#56663A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4.5" width="12" height="16" rx="2"></rect><path d="M9.5 4.5V3.5h5v1"></path></svg>
          Paste from clipboard
        </button>

        <button onClick="{{start}}" style="height: 52px; border-radius: 26px; border: none; background: #CCD5AE; color: #1A1A18; cursor: pointer; font-size: 16px; font-weight: 600">Import recipe</button>
      </div>
    </sc-if>

    <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 26px 0 40px">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#56663A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 11h16v2.5A6.5 6.5 0 0 1 13.5 20h-3A6.5 6.5 0 0 1 4 13.5z"></path><path d="M2.5 11h19"></path>
          <path class="ck-steam" d="M9 7.5c0-1.2 1-1.5 1-2.7"></path><path class="ck-steam2" d="M14 7.5c0-1.2 1-1.5 1-2.7"></path>
        </svg>
        <span style="font-size: 15px; color: #6E6E68">Picking out the ingredients…</span>
        <button onClick="{{cancel}}" style="height: 44px; border: none; background: transparent; padding: 0 12px; cursor: pointer; font-size: 14px; font-weight: 600; color: #56663A">Cancel</button>
      </div>
    </sc-if>

    <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #F4F4F1; font-size: 14px; line-height: 1.4">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
          <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{errLink}}</span>
        </div>
        <button onClick="{{toText}}" style="height: 52px; border-radius: 26px; border: none; background: #CCD5AE; color: #1A1A18; cursor: pointer; font-size: 16px; font-weight: 600">Paste the recipe text instead</button>
        <button onClick="{{retry}}" style="height: 44px; border: none; background: transparent; cursor: pointer; font-size: 15px; font-weight: 600; color: #56663A">Try another link</button>
      </div>
    </sc-if>

    <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{found}}" as="g" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; justify-content: space-between; min-height: 40px; border-bottom: 1px solid #F1F1EE; font-size: 15px">
              <span>{{g.name}}</span>
              <span style="{{g.style}}">{{g.state}}</span>
            </div>
          </sc-for>
        </div>
        <button onClick="{{addMissing}}" style="{{missingStyle}}">{{missingLabel}}</button>
        <a href="AppRecipes.dc.html" style="height: 52px; border-radius: 26px; background: #CCD5AE; color: #1A1A18; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Save to Recipes</a>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["edit","error"],"default":"edit"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const err = props && props.step === 'error';
    this.state = { mode: 'link', step: err ? 'error' : 'edit', link: err ? 'https://example-news.com/food/best-summer-dinners' : '', text: '', added: false, hint: '' };
  }
  renderVals() {
    const { mode, step, link, text, added, hint } = this.state;
    const lines = text.split('\n').filter((l) => /^\s*([0-9½¼¾]|[-•*])/.test(l)).length;
    const SAMPLE = 'Shakshuka\n2 tbsp olive oil\n1 onion, sliced\n1 red pepper\n2 cloves garlic\n1 tsp cumin\n1 can tomatoes\n4 eggs\n50 g feta\nSoften the onion and pepper…';
    const FOUND = [['Eggs', true], ['Tomatoes', false], ['Onion', true], ['Red pepper', true], ['Garlic', true], ['Cumin', true], ['Feta', false], ['Olive oil', true]];
    const missing = FOUND.filter((f) => !f[1]).length;
    return {
      title: step === 'done' ? 'Shakshuka' : step === 'error' ? 'No recipe on that page' : 'Import a recipe',
      sub: step === 'error' ? 'We couldn’t find ingredients or steps there. It may be a list of recipes, or behind a login.' : step === 'done' ? '25 min · 2 servings. You have ' + (FOUND.length - missing) + ' of ' + FOUND.length + ' things.' : step === 'loading' ? 'This takes a few seconds.' : 'Paste a link from any recipe site, or the recipe itself. We’ll check it against your kitchen.',
      isEdit: step === 'edit', isLoading: step === 'loading', isDone: step === 'done', isError: step === 'error',
      errLink: link, text,
      hasHint: !!hint, hint,
      countText: text ? (lines ? 'Found ' + lines + ' ingredients' : 'No ingredients found yet. Paste the list with amounts.') : 'Tip: include the amounts, like “2 eggs”.',
      countStyle: 'font-size: 13px; ' + (text && lines ? 'font-weight: 600; color: #56663A;' : 'color: #6E6E68;'),
      onLink: (e) => this.setState({ link: e.target.value, hint: '' }),
      onText: (e) => this.setState({ text: e.target.value, hint: '' }),
      toText: () => this.setState({ step: 'edit', mode: 'text' }),
      retry: () => this.setState({ step: 'edit', mode: 'link', link: '' }),
      isLink: mode === 'link', isText: mode === 'text', link,
      modes: [['link', 'Link'], ['text', 'Text']].map(([id, label]) => {
        const on = id === mode;
        return {
          label, selected: on ? 'true' : 'false',
          style: 'border: none; border-radius: 22px; cursor: pointer; font-size: 14px; ' + (on ? 'background: #FFFFFF; color: #1A1A18; font-weight: 600; box-shadow: 0 1px 2px rgba(26,26,24,0.08);' : 'background: transparent; color: #6E6E68; font-weight: 500;'),
          pick: () => this.setState({ mode: id })
        };
      }),
      paste: () => this.setState(mode === 'text' ? { text: SAMPLE, hint: '' } : { link: 'https://somekitchenblog.com/shakshuka', hint: '' }),
      start: () => {
        if (mode === 'link' && !link) return this.setState({ hint: 'Paste a link first.' });
        if (mode === 'text' && !lines) return this.setState({ hint: 'Paste the ingredient list first.' });
        const ok = mode === 'text' || /shakshuka/i.test(link);
        this.setState({ step: 'loading' });
        setTimeout(() => { if (this.state.step === 'loading') this.setState({ step: ok ? 'done' : 'error' }); }, 1800);
      },
      cancel: () => this.setState({ step: 'edit' }),
      found: FOUND.map(([name, have]) => ({
        name, state: have ? 'In your kitchen' : (added ? 'On To Buy' : 'Missing'),
        style: 'font-size: 13px; ' + (have ? 'color: #6E6E68;' : added ? 'font-weight: 600; color: #56663A;' : 'font-weight: 600; color: #1A1A18;')
      })),
      missingLabel: added ? 'Added ' + missing + ' to To Buy' : 'Add ' + missing + ' missing to To Buy',
      missingStyle: 'height: 48px; border-radius: 24px; cursor: pointer; font-size: 15px; font-weight: 600; ' + (added ? 'background: #FFFFFF; border: 1px solid #ECECE8; color: #56663A;' : 'background: #F4F4F1; border: 1px solid #F4F4F1; color: #1A1A18;'),
      addMissing: () => this.setState({ added: !added })
    };
  }
}
</script>
</body>
</html>
