<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooked – Scan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2A2A27; color: #FFFFFF; font-family: 'Albert Sans', system-ui, sans-serif">
  <div style="position: absolute; left: 0; top: 400px; width: 390px; text-align: center; font-size: 13px; color: rgba(255,255,255,0.5)">[Live camera feed]</div>

  <div style="position: absolute; left: 20px; top: 56px; width: 350px; height: 44px; display: flex; align-items: center; justify-content: space-between">
    <a href="{{closeHref}}" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <span style="font-size: 17px; font-weight: 600">Scan</span>
    <span style="width: 44px; height: 44px"></span>
  </div>

  <div style="position: absolute; left: 40px; top: 116px; width: 310px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; text-shadow: 0 1px 8px rgba(0,0,0,0.55)">
    <p style="margin: 0; font-size: 16px; font-weight: 500; line-height: 1.35">{{hint}}</p>
    <sc-if value="{{isReceipt}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: 13px; line-height: 1.35; color: rgba(255,255,255,0.85)">Long receipt? Take it in parts.</p></sc-if>
  </div>

  <div style="position: absolute; left: 32px; top: 180px; width: 326px; height: 420px">
    <span style="position: absolute; left: 0; top: 0; width: 40px; height: 40px; box-sizing: border-box; border-top: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF; border-top-left-radius: 12px"></span>
    <span style="position: absolute; right: 0; top: 0; width: 40px; height: 40px; box-sizing: border-box; border-top: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF; border-top-right-radius: 12px"></span>
    <span style="position: absolute; left: 0; bottom: 0; width: 40px; height: 40px; box-sizing: border-box; border-bottom: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF; border-bottom-left-radius: 12px"></span>
    <span style="position: absolute; right: 0; bottom: 0; width: 40px; height: 40px; box-sizing: border-box; border-bottom: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF; border-bottom-right-radius: 12px"></span>
  </div>

  <div style="position: absolute; left: 20px; top: 632px; width: 350px; height: 80px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
    <button aria-label="Choose a photo or screenshot" style="justify-self: start; display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: transparent; color: #FFFFFF; cursor: pointer; padding: 0">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"></rect><path d="M3.5 16l5-4.5 4 3.5 3-2.5 5 4"></path><circle cx="15.5" cy="9.5" r="1.4"></circle></svg>
      </span>
      <span style="font-size: 12px; font-weight: 500">Photos</span>
    </button>
    <a href="{{reviewHref}}" aria-label="Take photo" style="width: 78px; height: 78px; box-sizing: border-box; border-radius: 50%; border: 4px solid #FFFFFF; display: flex; align-items: center; justify-content: center">
      <span style="width: 62px; height: 62px; border-radius: 50%; background: #FFFFFF"></span>
    </a>
    <button onClick="{{toggleFlash}}" aria-label="Flash" aria-pressed="{{flashOn}}" style="justify-self: end; display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: transparent; color: #FFFFFF; cursor: pointer; padding: 0">
      <span style="{{flashStyle}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13h6l-1 8 8-10h-6z"></path></svg>
      </span>
      <span style="font-size: 12px; font-weight: 500">{{flashLabel}}</span>
    </button>
  </div>

  <div role="tablist" aria-label="Scan mode" style="position: absolute; left: 20px; top: 748px; width: 350px; height: 56px; box-sizing: border-box; padding: 6px; border-radius: 28px; background: rgba(0,0,0,0.4); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="5">
      <button role="tab" aria-selected="{{m.selected}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"flow":{"editor":"enum","options":["app","onb","onbsolo"],"default":"app"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'receipt', flash: false };
  }
  renderVals() {
    const M = [
      { id: 'receipt', label: 'Receipt', hint: 'Fit the whole receipt inside the corners.' },
      { id: 'fridge', label: 'Fridge', hint: 'Point at an open shelf. We’ll add what we see to the fridge.' },
      { id: 'pantry', label: 'Pantry', hint: 'Point at a shelf. We’ll add what we see to the pantry.' },
      { id: 'freezer', label: 'Freezer', hint: 'Point at a drawer. We’ll add what we see to the freezer.' },
      { id: 'recipe', label: 'Recipe', hint: 'Fit the recipe page inside the corners to save it.' }
    ];
    const cur = M.find((m) => m.id === this.state.mode) || M[0];
    const f = this.state.flash;
    return {
      hint: cur.hint,
      isReceipt: cur.id === 'receipt',
      closeHref: ({ app: 'AppHome.dc.html', onb: 'Onb8Scan.dc.html', onbsolo: 'Onb8ScanSolo.dc.html' })[this.props.flow ?? 'app'],
      reviewHref: ({ app: 'AppScanReview.dc.html', onb: 'OnbCheck.dc.html', onbsolo: 'OnbCheckSolo.dc.html' })[this.props.flow ?? 'app'],
      flashLabel: f ? 'Flash on' : 'Flash',
      flashOn: f ? 'true' : 'false',
      flashStyle: 'width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; ' + (f ? 'background: #FFFFFF; color: #1A1A18;' : 'background: rgba(0,0,0,0.4); color: #FFFFFF;'),
      toggleFlash: () => this.setState({ flash: !f }),
      modes: M.map((m) => {
        const on = m.id === cur.id;
        return {
          label: m.label, selected: on ? 'true' : 'false',
          style: 'border: none; border-radius: 22px; padding: 0; font-size: 13px; font-weight: 500; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #1A1A18;' : 'background: transparent; color: #FFFFFF;'),
          pick: () => this.setState({ mode: m.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
